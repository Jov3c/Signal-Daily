# Signal 反向代理 —— `docs/16` 的「建议同域」
#
# ```text
# /       -> web（Next.js）
# /api/   -> api（NestJS）
# ```
#
# 同域是硬要求，不是偏好：Cookie 是 SameSite=Lax + HttpOnly（Agent 02），
# 跨域会直接失效；而且 AdminOriginGuard 按 Origin 判敏感操作，
# 同域才让它的允许列表只有一项。
#
# 首次签发证书前 infra/nginx/certs/ 里是空的，443 起不来 ——
# 那时先用 80 跑一次 certbot 的 webroot 验证（见 infra/nginx/README.md）。
#
# 不要在这层做鉴权或限流：限流在 API 里（Agent 02 的 Redis 固定窗口，
# fail-closed），代理层的限流会让「Redis 挂了」的行为变得不可预测。

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # docs/15：requestId 要贯穿 Web -> API -> Queue -> Worker。
  map $http_x_request_id $request_id_final {
    default   $http_x_request_id;
    ""        $request_id;
  }

  server_tokens off;

  log_format signal_json escape=json
    '{"timestamp":"$time_iso8601","level":"info","service":"nginx",'
    '"requestId":"$request_id_final","method":"$request_method","url":"$request_uri",'
    '"status":$status,"durationMs":$request_time}';
  access_log /var/log/nginx/access.log signal_json;
  error_log  /var/log/nginx/error.log warn;

  sendfile on;
  client_max_body_size 2m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1024;

  upstream signal_web { server web:3000; }
  upstream signal_api { server api:3001; }

  # HTTP：只做两件事（ACME 验证 + 跳转 443）
  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # API 优先匹配
    location /api/ {
      proxy_pass http://signal_api;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      # 追加而不是覆盖：Agent 02 的 per-IP 限流取最后一段（不可伪造），
      # 前提是 api 端口不直接对公网暴露（agent-02 的 CCR 第 3 项）。
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id      $request_id_final;
      proxy_read_timeout 30s;
    }

    # 健康检查（docs/04：不在 /api/v1 下）
    location /health/ {
      proxy_pass http://signal_api;
      proxy_http_version 1.1;
      proxy_set_header Host         $host;
      proxy_set_header X-Request-Id $request_id_final;
      access_log off;
    }

    location / {
      proxy_pass http://signal_web;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id      $request_id_final;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
