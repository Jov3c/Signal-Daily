# 部署 —— docs/16 的 Deploy 段
#
# ```text
# GitHub Actions 构建镜像 -> VPS pull -> compose up
# **Migration 成功后再切 app**
# 保留上一镜像 tag 便于回滚
# ```
#
# ⚠ 这里的 `ROLLBACK_TAG` 不是装饰：迁移**可能有破坏性**，
# 那时「切回上一版镜像」是唯一的快速止血手段。所以每次部署前记下它、
# 部署后写进仓库变量，回滚 job 直接用。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个部署在跑；不要 cancel —— 半途取消可能停在「迁移已跑、app 没切」
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── 构建并推镜像 ─────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, worker, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: ${{ matrix.target }}
          push: true
          # 两个 tag：可追溯的 sha + 便于回滚的 previous
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.target }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.target }}:latest
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # ── 部署（含 migration gate）────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: 记录当前镜像 tag（回滚用）
        id: previous
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "ROLLBACK_TAG=$(docker inspect --format='{{.Config.Image}}' signal-api-1 2>/dev/null || echo none)" >> $GITHUB_OUTPUT

      - name: 拉取新镜像
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            cd /opt/signal
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull api worker web

      # ⚠ **migration gate**：迁移失败就**不切 app**（docs/16）。
      # 用一次性的 compose run 跑迁移，它的退出码决定后面是否继续。
      - name: Migration gate（失败则中止部署）
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/signal
            docker compose run --rm --no-deps api npx prisma migrate deploy

      - name: 切换应用
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/signal
            export IMAGE_TAG=${{ github.sha }}
            docker compose up -d --no-deps api worker web
            ./scripts/ops/healthcheck.sh

      - name: 记住这一版的 tag（下次回滚用）
        if: success()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/signal
            echo "${{ github.sha }}" > .last-good-tag

      - name: 部署失败 → 回滚到上一镜像
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/signal
            PREV="$(cat .last-good-tag 2>/dev/null || echo none)"
            if [ "$PREV" = "none" ]; then
              echo "没有可回滚的 tag —— 需要人工介入" >&2
              exit 1
            fi
            echo "回滚到 $PREV"
            export IMAGE_TAG="$PREV"
            docker compose up -d --no-deps api worker web
            ./scripts/ops/healthcheck.sh
