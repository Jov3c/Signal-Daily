# 部署 —— docs/16 的 Deploy 段
#
# ```text
# GitHub Actions 构建镜像 -> VPS pull -> compose up
# **Migration 成功后再切 app**
# 保留上一镜像 tag 便于回滚
# ```
#
# ⚠ 这里的 `ROLLBACK_TAG` 不是装饰：迁移**可能有破坏性**，
# 那时「切回上一版镜像」是唯一的快速止血手段。所以每次部署前记下它、
# 部署后写进仓库变量，回滚 job 直接用。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个部署在跑；不要 cancel —— 半途取消可能停在「迁移已跑、app 没切」
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── 测试门禁 ─────────────────────────────────────────────────────────
  #
  # ⚠ **这个 job 是 2026-10-01 补上的，而它此前不存在。**
  #
  # 在那之前，这个工作流是「push to main → 直接构建 → 迁移 → 上生产」，
  # **从头到尾没有任何一步跑过测试** —— 尽管仓库里当时已有 1950 个测试。
  # 换句话说：一个会让登录链断掉的提交可以直接部署到生产，而这**不是假设** ——
  # `ed0b1a1` 修掉的那个登录缺陷（`verifyEmailCode` 漏读 `{data:…}` 封套，
  # 登录成功后整页崩）在修好之前一直存在，而它所在的提交是推到了 main 的。
  #
  # `build` 依赖本 job：测试不过 → 不构建 → 不迁移 → 不切流量。
  # 回滚 job 不受影响（它走的是 `failure()`，且用的是已存在的镜像）。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠ **不要**再加 `with: version:` —— 版本由 `package.json` 的
      # `packageManager: pnpm@11.15.1` 决定，两处同时指定会直接报错。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # ⚠ **两条都要，不是重复。** 根的 `pnpm typecheck` 只做
      # `tsc -b` + 单独跑 web 的 typecheck；而 `@signal/api` 与 `@signal/worker`
      # 各自的 typecheck 里还有一句 `tsc -p test/tsconfig.json` ——
      # **只有 `-r` 那一遍会检查 `apps/*/test/**`**。
      # 删掉 `-r` 会让两个 app 的测试目录重新变成「不参与类型检查」，
      # 而那正是 `apps/api/src/modules/auth/mail-sender.ts` 里记着的老毛病。
      - run: pnpm typecheck
      - run: pnpm -r typecheck

      # ⚠ **`--maxWorkers=4` 不是调优，是必需。** 默认会给每个测试文件起一个
      # worker（本仓库约 86 个），把机器压到真监听端口的测试**假红**
      # （boot / auth-mail / common-http，单独复跑全过）。
      # 见 `handoffs/agent-14-HANDOFF.md` §5 与 WALKTHROUGH-FOLLOWUP §6。
      # ⚠ 但 `visual-contract` / `contract-parity` / `client-api` 的红**是真红**。
      - run: pnpm test:ci

      - run: pnpm ops:verify

  # ── 集成测试（真实 MySQL 8.4 + Redis）────────────────────────────────
  #
  # ⚠ 2026-10-02 新增。此前**三套真实依赖的测试从未在 CI 里跑过** ——
  # `test:db` / api 集成 / worker 集成只有人在本地手动跑（`pnpm test:ci` 明确
  # 排除 `*.integration.spec.ts`，因为默认测试必须能在没有数据库的机器上通过）。
  # 而它们抓的恰恰是单测抓不到的那一类：真 SQL、真唯一约束、真并发/死锁。
  # 2026-10-01 那几个 P0（`applyEvidencePlan` 的 P2034 死锁、Topic 计数口径、
  # `/today` 的排序）**全都是真库测试才可能发现的**。
  #
  # ⚠ **三步必须串行**：api 与 worker 的集成测试**共用同一个测试库**（不隔离
  # schema），并行会让彼此的断言互相干扰。三份 vitest 配置里都写了
  # `fileParallelism: false` 正是这个原因 —— 跨套件同理。
  integration:
    needs: test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: signal
          MYSQL_USER: signal
          MYSQL_PASSWORD: signal
        ports: ['3306:3306']
        # ⚠ healthcheck 是必需的：MySQL 容器「已启动」远早于「可接受连接」，
        # 没有它第一步就会连不上（这正是 compose 那边踩过的同一个坑）。
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      # ⚠ 集成测试会先看 `process.env`、再回落到仓库根的 `.env` ——
      # 而 CI 里那个文件**不存在**（被 gitignore）。所以必须由这里注入。
      DATABASE_URL: mysql://signal:signal@127.0.0.1:3306/signal
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ⚠ **不能省**：这些测试直接 `import '@prisma/client'`。
      # 本地开发最容易忽略这一步 —— 开发机上早就有一份生成好的客户端，
      # CI 是干净的。
      - run: pnpm db:generate

      # ⚠ migration 必须在测试之前：测试假设 schema 已是迁移后的形状。
      - run: pnpm db:migrate

      # ⚠ **`pnpm build` 不能省** —— 2026-10-02 实测：第一版 CI 只跑到这里就挂了。
      #
      # `prisma/__tests__/database.integration.spec.ts` 的「Seed 幂等」一节会
      # **自己执行** seed（`execFileSync(node, ['prisma/dist/seed.js'])`），
      # 并且有一条用例就叫「seed 产物存在（**需先 `pnpm build`**）」。
      # 也就是说它要的是**构建产物**，不是 `pnpm db:seed`（那样只跑不建）。
      #
      # 本地不会发现：开发机上 `prisma/dist/seed.js` 早就在（`pnpm build` 过一次
      # 就有了），而 CI 是干净的。失败形态也很绕 —— 报的不是「文件不存在」，
      # 而是 seed 没跑成之后 `findFirstOrThrow` 找不到 `ai-models` / `x-karpathy`。
      - run: pnpm build

      # ⚠ 三步**串行**（共用同一个库）。不要合并成一条并发命令。
      - run: pnpm test:db
      - run: pnpm --filter @signal/api test:integration
      - run: pnpm --filter @signal/worker test:integration

  # ── 真浏览器 E2E（Playwright）─────────────────────────────────────────
  #
  # ⚠ 2026-10-02 新增。清单 P2-05 明确要求：**先作为独立 job 接入，
  # 不要第一步就设成部署要求** —— Playwright 在 CI 里最容易假红，
  # 第一轮先确认环境稳定，稳定之后再由用户决定要不要并进 `build.needs`。
  # 所以本 job **不在 `build.needs` 里**。
  #
  # 保留 harness 自带的全部护栏（它们在这里同样是有效的）：
  #   NODE_ENV=production 拒绝运行 / 非本机 DB 或 Redis 拒绝运行 /
  #   构建产物不新鲜拒绝运行 / 用例自己拒绝 page.reload()。
  e2e:
    needs: test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: signal
          MYSQL_USER: signal
          MYSQL_PASSWORD: signal
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        # ⚠ **映射到 6390，不是 6379** —— 不是笔误。
        # `e2e/helpers.ts` 里有一条本机约定：`rewriteRedisPort()` **无条件**把
        # REDIS_URL 的端口改成 6390（开发机上 `.env` 写 6379 而实跑的 Redis 在 6390）。
        # 那条约定没有「显式指定就不覆盖」的逃生口，所以 CI 必须顺着它来 ——
        # 否则 api 子进程会去连一个没人监听的端口，失败信息还完全指不到这里。
        ports: ['6390:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      # ⚠ harness 的 `loadHarnessEnv()` 会读仓库根的 `.env` —— CI 里没有那个文件
      #（被 gitignore）。所以 api 子进程 `parseEnv()` 需要的每一项都必须由这里给。
      # 取值与 `@signal/test-utils` 的 `TEST_ENV` 一致，除了 NODE_ENV：
      # harness 要求 `development`（api 的 `ConsoleMailSender` 在 production 下
      # 按设计拒绝工作，那样就拿不到验证码，登录用例必挂）。
      NODE_ENV: development
      APP_TIMEZONE: Asia/Shanghai
      APP_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:3000/api
      DATABASE_URL: mysql://signal:signal@127.0.0.1:3306/signal
      REDIS_URL: redis://127.0.0.1:6390
      AUTH_ACCESS_TOKEN_SECRET: e2e-access-token-secret
      AUTH_REFRESH_TOKEN_PEPPER: e2e-refresh-token-pepper
      EMAIL_OTP_PEPPER: e2e-email-otp-pepper
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate
      - run: pnpm db:migrate

      # ⚠ **两个构建都不能省**：harness 起的是 `node apps/api/dist/main.js` 与
      # `next start`，而且它有一条**构建新鲜度硬校验** —— 源码比产物新就直接
      # 拒绝运行（防止「改了代码忘了重建」跑出假绿）。所以这里必须和它对齐。
      - run: pnpm build
      - run: pnpm --filter @signal/web build

      - run: npx playwright install --with-deps chromium

      - run: pnpm test:e2e

      # 失败时把 trace / 截图 / 错误上下文带出来 —— 没有它们，CI 上的
      # Playwright 失败基本等于「红了一个数字」，没法排查。
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: e2e/.artifacts/
          retention-days: 7
          if-no-files-found: ignore

  # ── 构建并推镜像 ─────────────────────────────────────────────────────
  build:
    needs: [test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, worker, web]
    steps:
      - uses: actions/checkout@v4

      # ⚠ 仓库名 `Jov3c/Signal-Daily` **含大写**，而 GHCR 的引用名**必须全小写**。
      # 直接用 `${{ github.repository }}` 打 tag 会让 buildx 报：
      #   invalid tag "ghcr.io/Jov3c/Signal-Daily/api:…": repository name must be lowercase
      # 而且它挂在**打 tag** 这一步 —— 三条 build 会全部作废。
      #
      # 这不是新问题：2026-10-01 查证，此前 **13 次运行全部失败在同一行**，
      # 这个流水线从未成功过一次。修复前请先看一眼 `gh run list`。
      # GitHub Actions 的表达式里没有 toLower，所以用一个 run 步骤算出来。
      - name: 算出小写的镜像前缀
        id: image
        run: |
          echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: ${{ matrix.target }}
          push: true
          # 两个 tag：可追溯的 sha + 便于回滚的 previous
          tags: |
            ${{ steps.image.outputs.prefix }}/${{ matrix.target }}:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}/${{ matrix.target }}:latest
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # ── 部署（含 migration gate）────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: 记录当前镜像 tag（回滚用）
        id: previous
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "ROLLBACK_TAG=$(docker inspect --format='{{.Config.Image}}' signal-api-1 2>/dev/null || echo none)" >> $GITHUB_OUTPUT

      - name: 拉取新镜像
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            cd /opt/signal
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull api worker web

      # ⚠ **migration gate**：迁移失败就**不切 app**（docs/16）。
      # 用一次性的 compose run 跑迁移，它的退出码决定后面是否继续。
      - name: Migration gate（失败则中止部署）
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/signal
            docker compose run --rm --no-deps api npx prisma migrate deploy

      - name: 切换应用
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/signal
            export IMAGE_TAG=${{ github.sha }}
            docker compose up -d --no-deps api worker web
            ./scripts/ops/healthcheck.sh

      - name: 记住这一版的 tag（下次回滚用）
        if: success()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/signal
            echo "${{ github.sha }}" > .last-good-tag

      - name: 部署失败 → 回滚到上一镜像
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/signal
            PREV="$(cat .last-good-tag 2>/dev/null || echo none)"
            if [ "$PREV" = "none" ]; then
              echo "没有可回滚的 tag —— 需要人工介入" >&2
              exit 1
            fi
            echo "回滚到 $PREV"
            export IMAGE_TAG="$PREV"
            docker compose up -d --no-deps api worker web
            ./scripts/ops/healthcheck.sh
