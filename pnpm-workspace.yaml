packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  # Prisma 需要 postinstall 下载查询引擎；两个包均为 Prisma 官方包。
  '@prisma/client': true
  '@prisma/engines': true
  # msgpackr 的可选原生加速器（BullMQ → msgpackr 的 optionalDependency）。
  # 关闭构建：msgpackr 会自动回退到纯 JS 实现，功能不受影响；
  # 打开则要求部署机具备 node-gyp 工具链，是没必要的部署负担。
  # 见 handoffs/agent-03-HANDOFF.md「Environment Variables / 依赖」。
  msgpackr-extract: false
  prisma: true
