# Signal 生产编排（香港 VPS 单机）—— `docs/16-deployment-backup.md`
#
# ```text
# nginx → web / api        （同域：/ → web、/api/ → api）
# api   → mysql, redis
# worker→ mysql, redis
# mysql / redis：**只在 internal 网络里**，不映射任何宿主端口
# ```
#
# ── 起：
#   cp .env.example .env   # 填好 secret（**不要提交**）
#   docker compose up -d --build
#   docker compose ps      # 全部 (healthy) 才算起来
#
# ── ⚠ 四条硬约束（改动前请先读 `scripts/ops/verify-deploy.mjs`）────────
#
# 1. **MySQL / Redis 绝不映射宿主端口** —— `docs/16`：「MySQL 不暴露公网」
#    「Redis 不暴露公网」。它们的端口只出现在 `internal` 网络上。
# 2. **nginx 是唯一对外的入口**（80/443）。api 与 web 也不映射端口。
# 3. **每个服务都要有 healthcheck** —— `docs/16` 的 compose 段要求
#    `container health` 可验，而「depends_on + healthy」是启动顺序的唯一依据。
# 4. **日志必须轮转**：`json-file` 的 `max-size` / `max-file`
#    （`docs/15`：Docker log rotate）。不设的话宿主机磁盘会被写满。

name: signal

# ── 网络 ───────────────────────────────────────────────────────────────
networks:
  # 对外服务：nginx 在这里，web / api 也在这里（nginx 要能连到它们）。
  edge:
    driver: bridge
  # 内部：mysql / redis **只**在这里。`internal: true` 让这个网络
  # **没有任何出站路由** —— 即使容器被攻破也连不出去。
  internal:
    driver: bridge
    internal: true
  # 出站：**只给需要访问互联网、但不需要被 nginx 连到的组件**（目前只有 worker）。
  #
  # ⚠ 为什么不直接复用 `edge`：`edge` 是 nginx 所在的那张网。把它加给 worker
  # 虽然能出网，但等于让采集/流水线进程与对外入口同处一个二层网络 —— 而这个
  # 进程要处理的是**外部不可信内容**（RSS / X / 网页），是最不该和入口相邻的。
  # 分一张 `egress` 就得到最小权限：能出网，但连不到 nginx。
  #
  # 注意 `api` 不在这里：nginx 必须能连到它，所以它必须在 `edge` 上，
  # 而 `edge` 本身就有网关 —— 再给它加 `egress` 是多余的。
  egress:
    driver: bridge

# ── 日志轮转（docs/15）────────────────────────────────────────────────
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

# ── 通用：从 .env 读，缺一个就起不来（避免「配置漏了但服务照跑」）──────
x-env-file: &env-file
  - .env

services:
  # ── MySQL ────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # ⚠ **没有 `ports:`** —— 见文件头第 1 条
    networks: [internal]
    command:
      # ⚠ 这里原本有一行 `--default-authentication-plugin=caching_sha2_password`，
      # 2026-10-01 **已删除**。两个理由，任一个都足以删掉它：
      #
      # 1. **MySQL 8.4 把这个变量删了**（8.0.27 弃用 → 8.4 移除，改成
      #    `--authentication-policy`）。而本服务用的是 `image: mysql:8.4`，
      #    于是 mysqld **启动即 abort**：
      #      [ERROR] [Server] unknown variable 'default-authentication-plugin=…'
      #      [ERROR] [Server] Aborting
      #    **MySQL 根本起不来**，而 api/web/worker 都 depends_on 它 healthy ——
      #    所以整栈一个都起不来。这是 `docker compose up` 的**首个**失败点。
      # 2. **它本来就是多余的**：8.4 的默认 `authentication_policy` 就是
      #    `caching_sha2_password`。删掉不改变任何行为。
      #
      # ⚠ 它同时解释了另一个现象：abort 发生在**初始化中途**，会把
      # `mysql-data` 卷写成半初始化状态（`Table 'mysql.plugin' doesn't exist`）。
      # 所以修完这一行之后，**必须先把那个卷删掉再起**，否则仍然起不来。
      #
      # binlog：`docs/16` 的 RPO <= 15min 靠它（全量 dump 每天一次，
      # 两次 dump 之间用 binlog 补齐）
      - --log-bin=/var/lib/mysql/mysql-bin
      - --binlog-expire-logs-seconds=604800
      - --binlog-format=ROW
      - --server-id=1
      # ⚠ 时区**必须在命令行里也写一遍** —— 2026-10-01 实测。
      #
      # `infra/mysql/my.cnf` 里写着 `default-time-zone = '+00:00'`，但那份文件
      # 被 MySQL **静默忽略**（它先打一条 Warning 就继续启动）：
      #   [Warning] World-writable config file '/etc/mysql/conf.d/signal.cnf' is ignored
      # （Docker Desktop on Windows 的挂载权限所致；真正的 Linux 主机上多半不会。）
      #
      # 实测生效值：`@@global.time_zone = SYSTEM`，而 compose 给这个容器设了
      # `TZ: Asia/Shanghai` → **NOW() 比应用写入的 UTC 值快 8 小时**。
      # 这正是 `my.cnf` 注释里记着的那个事故：
      #   「Agent 03 记录过本机 time_zone=SYSTEM=Asia/Shanghai 造成的静默事故」
      #
      # 上面那几条 binlog 参数之所以一直正常，是因为它们**在命令行里也写了一份**
      # —— 被忽略的 cnf 那份不是唯一来源。时区这一条当时漏了。
      - --default-time-zone=+00:00
    env_file: *env-file
    environment:
      MYSQL_DATABASE: signal
      MYSQL_USER: signal
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 必填}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必填}
      # 备份容器能读 binlog（`scripts/ops/backup-mysql.sh` 走 mysql 客户端）
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # `docs/15` / `docs/16` 要求的字符集与 FULLTEXT：见文件头说明
      - ./infra/mysql/my.cnf:/etc/mysql/conf.d/signal.cnf:ro
    healthcheck:
      # ⚠ 用 `mysqladmin ping` 而不是 `-e 'SELECT 1'`：前者在「server 还在
      # 初始化」阶段就会失败，这正是我们要的（healthy 之后才允许别人启动）。
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *default-logging

  # ── Redis ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # ⚠ **没有 `ports:`** —— 见文件头第 1 条
    networks: [internal]
    # `docs/13`：**Redis 不是业务数据库** —— 即使全丢，已发布内容与采集事实
    # 都能从 MySQL 恢复。所以**刻意关掉持久化**：RDB/AOF 只会让人误以为
    # Redis 里有需要保住的东西。容量由 `maxmemory` 兜底。
    command:
      - redis-server
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging

  # ── API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: api
    restart: unless-stopped
    networks: [edge, internal]
    env_file: *env-file
    environment:
      NODE_ENV: production
      # compose 里的服务名就是 DNS
      DATABASE_URL: mysql://signal:${MYSQL_PASSWORD:?}@mysql:3306/signal
      REDIS_URL: redis://redis:6379
      # ⚠ 同 `web` 服务：`AdminOriginGuard` 拿它比对浏览器发来的 Origin，
      # 而浏览器看到的是 nginx 那一层。不覆盖的话它会是 `.env` 里的
      # `http://localhost:3000`，于是**后台所有写操作被判跨源、返回 403**。
      APP_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # `docs/15`：`/health/ready` 只依赖 MySQL + Redis（外部 AI/X/GitHub 不影响）
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3001/health/ready\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ── Worker ───────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: worker
    restart: unless-stopped
    # ⚠ **必须也在 `edge` 上** —— 2026-10-01 修。
    #
    # 这里原本写的是「worker **不需要** edge：它不出网给用户（出网只去外部 API）」，
    # 并只挂 `internal`。那行注释把两件事混为一谈了：
    #
    # ```text
    # 「不接收用户的入站流量」 ≠ 「不需要出站」
    # ```
    #
    # 而 `internal: true` 掐断的**恰恰是出站**（它让这个网络没有任何对外路由）。
    # 于是 worker —— **全栈唯一必须访问互联网的组件**（它负责抓 RSS / X）——
    # 被放在了一个连 DNS 都出不去的网络上。实测：
    #   SOURCE_FETCH_FAILED: RSS source openai-blog: Source host could not be resolved
    #                        (DNS_RESOLUTION_FAILED)
    #   容器内 EAI_AGAIN
    # 即：**采集在部署形态下根本不可能工作** —— 而采集是这个产品的核心动作。
    #
    # ⚠ **挂在 `egress` 上，不是 `edge`。** 第一版修复图省事直接加了 `edge`
    # （api 就在那上面），但那是错的取舍：`edge` 是 nginx 所在的那张网，
    # 而 worker 处理的正是**外部不可信内容**（RSS / X / 网页）—— 最不该
    # 和对外入口同处一个二层网络。`egress` 给到同样的出网能力，但连不到 nginx。
    #
    # worker 仍然不 `ports:`、不监听端口（见下面的 healthcheck 注释），
    # 所以它在哪张网上都不引入入站暴露；区别在**它能看见谁**。
    networks: [internal, egress]
    env_file: *env-file
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://signal:${MYSQL_PASSWORD:?}@mysql:3306/signal
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # worker 不监听端口 —— 用「进程还活着且没卡死」的近似判据：
      # 主进程存在即视为存活（`docs/15` 的 live 语义）。
      test: ['CMD-SHELL', 'test -d /proc/1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  # ── Web ──────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: web
    restart: unless-stopped
    networks: [edge]
    env_file: *env-file
    environment:
      NODE_ENV: production
      # ⚠ **容器里的地址与「宿主直跑」不同**，`.env` 里那两行在这里是错的：
      #   API_BASE_URL=http://localhost:3000/api  ← 在 web 容器里指 web **自己**
      # 服务端渲染取数走这个值 → 请求自己 → 撞上自己的 rewrite
      # → `http://127.0.0.1:3001`（还是自己）→ ECONNREFUSED。
      # 2026-10-01 实测：每个前台页面都 500，日志是
      #   Failed to proxy http://127.0.0.1:3001/api/v1/x  ECONNREFUSED
      # compose 的服务名就是容器网络里的 DNS 名，所以是 `api:3001`。
      API_BASE_URL: http://api:3001/api
      # 对外基址 = 浏览器看到的那一层（nginx）。`AdminOriginGuard` 拿它比对 Origin。
      # ⚠ 生产必须覆盖成真实域名，否则后台的写操作会被判跨源、返回 403。
      APP_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3000/\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ── Nginx（唯一对外入口）────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [edge]
    # ⚠ 这是**唯一**映射宿主端口的服务（见文件头第 2 条）。
    # 80 只用来自动续签与跳转；业务走 443。
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Let's Encrypt 证书（`infra/nginx/README.md` 有申请步骤）
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - api
      - web
    healthcheck:
      test: ['CMD-SHELL', 'nginx -t']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

volumes:
  mysql-data:
  certbot-webroot:
